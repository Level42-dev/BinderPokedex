      traits: >-
        Match the exact standing Evoli source: warm brown four-legged body with all four feet on the ground, very large pointed ears with dark inner areas, black oval eyes and white highlights, tiny nose and a subtle closed smile. Preserve the jagged cream neck ruff and its large bushy tail rising to image-right with a cream tip. Do not invent red cheek markings, change it to a seated pose or hide its standing legs.
