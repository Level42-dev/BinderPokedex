      traits: >-
        Match the exact seated Relaxo source: broad teal-blue body, pointed ears, closed narrow eyes, cream face and enormous round cream belly. Preserve the continuous curved smiling mouth and its two separate small upward white teeth. Both arms extend to the sides and show their small white claws. Both large forward-facing feet retain the brown oval paw pads and exactly the distinct white source toe claws, without extra spikes.
    pokeapi:official-artwork:25:
      sha256: bd2163009d392e192c134a5f1c4ccceafd5d7c57a704373c6b6be4be0091cc5f
      traits: >-
        Match this exact cheerful Pikachu source pose: two long black-tipped ears, two round dark eyes with white highlights, red cheeks, an open pink mouth, the image-left arm stretched outward, the other bent toward the chest, two small standing feet and one zigzag yellow tail with its brown base. Keep the face and all limb contours source-close. Two long jungle grass blades may naturally pass in front of its extended arm and lower belly; they are foreground scenery, not new body outlines.
