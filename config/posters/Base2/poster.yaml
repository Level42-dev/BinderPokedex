    concept: the nostalgic 1999 Jungle expansion and its untamed woodland life
    setting: The artwork contains a lush late-1990s cel-painted jungle clearing with layered
      broadleaf canopy, mossy outer rock shelves, distant hanging vines, and a small sunlit
      river glimpse deep in the background.
    lighting: Warm humid daylight filters through the upper-left canopy.
    rendering: Use nostalgic hand-painted cel-animation linework, rich but restrained natural
      greens, and soft layered woodland depth.
    ground_noun: jungle grass
    constraints:
    - Keep dense leaves, vines, rocks, and the river in the distance or at the outer edges
      so the protected subject silhouettes remain readable.
    - Two long broad jungle-grass blades rise from the near left and bottom foreground and pass naturally in front of Pikachu's extended arm and lower belly, as real foreground vegetation would. Keep its face unobstructed and give Relaxo and Evoli equally convincing ground contact.
