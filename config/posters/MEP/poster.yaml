      traits: Match this exact Bulbasaur source pose and low four-legged silhouette. Keep the joined folds
        and pointed tips of the large green bulb, the two upright pointed ears, two separate red eyes
        with tall white highlights, tiny nostrils, and smiling open mouth with its pink tongue and small
        white corner teeth. Preserve the angular dark teal forehead, cheek, shoulder and leg markings,
