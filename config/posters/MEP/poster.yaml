        the three fully visible feet has EXACTLY THREE separate white claw tips in IMAGE 2. In particular
        the large near front paw, at image-center below the small angular leg spot, must have only three
        white tips, not four. Match the three-tip paw outlines and keep the partly hidden farther limb
        hidden as in the source. Do not invent extra toes or limbs.
