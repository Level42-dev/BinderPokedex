        cheek, shoulder and leg markings, including the small angular spot
        above the near front leg. Copy the visible short legs. Each of the
        three fully visible feet has EXACTLY THREE separate white claw tips
        in IMAGE 2. In particular the large near front paw, at image-center
        below the small angular leg spot, must have only three white tips,
        not four. Match the three-tip paw outlines and keep the partly hidden
        farther limb hidden as in the source. Do not invent extra toes or limbs.
    "pokeapi:official-artwork:4":
      sha256: a1ece1866497c8b11df3853190781c45f724a33a839cb5525597466d03deafd8
      traits: >-
        Match this exact smiling Charmander source pose with both short arms
        extended sideways, two planted legs with white claws, tall blue eyes
        with dark pupils and white highlights, and an open pink mouth with
        the small separate white corner teeth. Preserve the broad pale cream
        throat and belly. The single curved tail rises to the image-right:
        critically, its LOWER EDGE carries a clearly visible narrow pale cream
        underside from behind the body along the entire upward curve to just
        beneath the flame. Keep that light continuous stripe distinct from
        the orange-brown upper tail; it must not become orange or dark brown.
        Copy the pointed orange-and-yellow flame, the head angle and compact
        source proportions. Do not add extra tails, limbs or flame ornaments.
    "pokeapi:official-artwork:7":
      sha256: 8a4752fc89907ec628635865afcf13868d136b82f1e6f39e00ba590754a43290
      traits: >-
        Match this exact upright Squirtle source pose, blue rounded head and
        body, two separate burgundy-dark eyes with white highlights, tiny
        nostrils and the closed curved smiling mouth. Preserve both extended
        short arms and both planted feet with the source's compact pointed
        finger and toe outlines. Keep the cream segmented belly shell and
        the brown rear shell with its pale rim. Copy the one large blue tail
        curled into a clearly drawn inward spiral on the image-right.
        Preserve the exact head/body proportions and limb pose; no open mouth,
        extra fingers, additional tails or changed shell divisions.
