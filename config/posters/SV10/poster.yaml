        individually patterned wing feathers and long separate colored tail feathers.
    pokeapi:official-artwork:255:
      sha256: d234db13f46ac30452288fee011df2857d93bac22f7d038d6b472ef14a651950
      traits: Match the exact orange Torchic source pose with its three-point head tuft, short beak, black
