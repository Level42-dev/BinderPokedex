      traits: Match this exact pale yellow-green Chikorita source pose, its rounded head and body, two
        separate reddish oval eyes, tiny smiling mouth, three visible short feet and a partly obscured
        fourth limb. Preserve the single broad green leaf arching up and toward image-right from its narrow
