    pokeapi:official-artwork:4:
      sha256: a1ece1866497c8b11df3853190781c45f724a33a839cb5525597466d03deafd8
      traits: 'Match this exact smiling Charmander source pose with both short arms extended sideways,
        two planted legs with white claws, tall blue eyes with dark pupils and white highlights, and an
        open pink mouth with the small separate white corner teeth. Preserve the broad pale cream throat
        and belly. The single curved tail rises to the image-right: critically, its LOWER EDGE carries
        a clearly visible narrow pale cream underside from behind the body along the entire upward curve
        to just beneath the flame. Keep that light continuous stripe distinct from the orange-brown upper
        tail; it must not become orange or dark brown. Copy the pointed orange-and-yellow flame, the head
        angle and compact source proportions. Do not add extra tails, limbs or flame ornaments.'
    pokeapi:official-artwork:250:
      sha256: 2365831e6c95a5c0448e905a461530a4c18d46f8c4ca5bb57f3a0a5a05a87274
      traits: Match the exact red, cream, yellow and green Ho-Oh source pose. Preserve its distinctly
