        tail; it must not become orange or dark brown. Copy the pointed orange-and-yellow flame, the head
        angle and compact source proportions. Do not add extra tails, limbs or flame ornaments.'
    pokeapi:official-artwork:25:
      sha256: bd2163009d392e192c134a5f1c4ccceafd5d7c57a704373c6b6be4be0091cc5f
      traits: 'Pikachu must match this exact cheerful yellow source pose: exactly two long black-tipped
        ears, two separate dark round eyes with white highlights, red cheek circles and the open pink
        mouth with distinct tongue. Preserve the image-left arm extended outward and the image-right arm
        bent toward the chest with its separate small pointed finger contours. Copy the two small standing
        feet and one continuous large yellow zigzag tail with its brown base. Preserve the source''s body
        proportions, expression, eye spacing, ear angles and hand pose; no extra fingers, ears, tails
        or facial marks. Scene-appropriate foreground overlap is allowed without changing these defining
        features.'
    pokeapi:official-artwork:131:
      sha256: 0dda58737b5c1d7db8e7b81ff61b41d0f23bc08ddbf166ca61c20d17d1d27113
      traits: 'Match the exact blue Lapras source pose and color pattern. CRITICAL SOURCE MARKINGS:
        copy every clearly visible DARK BLUE oval spot as its own filled patch, not a shadow:
        one high on the neck below the head, another lower on the neck, and the separate dark-blue
        spots beside and below the shell on the blue body. The long neck must be visibly spotted,
        never a smooth plain-blue tube. Keep the gentle face, paired head ears, cream underside,
        brown ridged shell and four separate flippers. Do not replace the neck spots with shell
        texture, grass or rock marks.'
