display_date:
  en: "October 2026"
  de: "Oktober 2026"
summary:
  en: "The English MEP promo collection grows to 120 entries, with original promo numbers and the existing localized collections preserved."
  de: "Die englische MEP-Promosammlung wächst auf 120 Einträge. Originalnummern und die bisherigen lokalisierten Sammlungen bleiben erhalten."
whats_new:
  en:
    title: "31 More MEP Promos for Your Binder"
    body:
      - "The English MEP collection grows from 89 to 120 entries, including Mega Zeraora ex, Mega Darkrai ex, Mega Dragonite ex, the four Delta Reign prerelease promos, and Pokémon RUN Pikachu #131."
      - "Each insert keeps its original promo number, including gaps between confirmed cards. The English panorama opening now shows the matching 120-card count."
      - "German, French, Spanish, and Italian collections keep their existing 88 cards. New entries are included in English until their localized editions are confirmed."
      - "The collection also includes confirmed promos announced for upcoming products; inclusion does not mean every product is already on sale."
  de:
    title: "31 weitere MEP-Promos für deinen Binder"
    body:
      - "Die englische MEP-Sammlung wächst von 89 auf 120 Einträge – darunter Mega-Zeraora-ex, Mega-Darkrai-ex, Mega-Dragoran-ex, die vier Prerelease-Promos zu Delta-Herrschaft und Pokémon RUN Pikachu #131."
      - "Jeder Einleger behält seine ursprüngliche Promonummer, einschließlich der Lücken zwischen bestätigten Karten. Die englische Panorama-Startseite zeigt jetzt passend 120 Karten."
      - "Die deutschen, französischen, spanischen und italienischen Sammlungen behalten ihre bisherigen 88 Karten. Neue Einträge sind zunächst auf Englisch enthalten, bis ihre lokalisierten Ausgaben bestätigt sind."
      - "Die Sammlung enthält auch bestätigte Promos für angekündigte Produkte. Die Aufnahme bedeutet daher nicht, dass jedes Produkt bereits erhältlich ist."
