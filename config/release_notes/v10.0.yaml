display_date:
  en: "October 2026"
  de: "Oktober 2026"
summary:
  en: "The 30 Years collections join corrected card lists, new Mega Evolution sets, and a panorama for every binder section."
  de: "Die 30-Jahre-Sammlungen ergänzen korrigierte Kartenlisten, neue Mega-Entwicklungs-Sets und ein Panorama für jeden Binder-Abschnitt."
whats_new:
  en:
    title: "30 Years. Complete Panoramas. Correct Card Lists."
    body:
      - "30 Jahre and its separate Klassische Sammlung now have complete card lists and their own anniversary panoramas. The available German, English, French, Spanish, and Italian editions keep their original card numbers."
      - "Every included collection and section opens with a panorama, including Stellarkrone and the newest Mega Evolution set Dunkelnacht."
      - "German Basic Energy labels match the physical cards, and trainer-owned names such as Ns Zoroark-ex remain intact in their TCG sets."
      - "The German promo selection keeps original numbers: 216 numbered SVP cards plus the unnumbered Terapagos & Freunde, and 88 MEP cards."
      - "Schwarze Blitze and Weiße Flammen use their German set logos, while long Trainer card names stay inside their cutting areas."
  de:
    title: "30 Jahre. Alle Panoramen. Korrekte Kartenlisten."
    body:
      - "30 Jahre und die separate Klassische Sammlung sind jetzt mit vollständigen Kartenlisten und eigenen Jubiläums-Panoramen dabei. Die verfügbaren deutschen, englischen, französischen, spanischen und italienischen Ausgaben behalten ihre Originalnummern."
      - "Jede enthaltene Sammlung und jeder Abschnitt beginnt mit einem Panorama – auch Stellarkrone und das neueste Mega-Entwicklungs-Set Dunkelnacht."
      - "Deutsche Basis-Energien tragen die Namen der echten Karten; Trainerzuordnungen wie Ns Zoroark-ex bleiben in den TCG-Sets erhalten."
      - "Der deutsche Promo-Stand umfasst 216 nummerierte SVP-Karten plus die unnummerierte Karte Terapagos & Freunde sowie 88 MEP-Karten, jeweils mit ihren ursprünglichen Nummern."
      - "Schwarze Blitze und Weiße Flammen verwenden ihre deutschen Setlogos; lange Trainernamen bleiben innerhalb der Schnittflächen."
