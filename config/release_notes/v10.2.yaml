display_date:
  en: November 2026
  de: November 2026
summary:
  en: Delta Reign joins Binder Pokédex with 141 numbered inserts in five languages and a nine-card
    panorama.
  de: Delta-Herrschaft ist mit 141 nummerierten Einlegern in fünf Sprachen und einem Panorama aus
    neun Karten dabei.
whats_new:
  en:
    title: Delta Reign and its Emerald Storm
    body:
    - 'Print all 141 Delta Reign inserts in their original numbered order, from #001 to #141. The
      set is available in German, English, French, Spanish, and Italian.'
    - Cut out the opening page to assemble a 3×3 panorama of Kyogre, Mega Rayquaza, and Groudon. The
      set logo and details match the language of each PDF.
  de:
    title: Delta-Herrschaft und der smaragdgrüne Sturm
    body:
    - 'Drucke alle 141 Einleger zu Delta-Herrschaft in ihrer ursprünglichen Nummernfolge von #001
      bis #141. Den Satz gibt es auf Deutsch, Englisch, Französisch, Spanisch und Italienisch.'
    - Aus den neun Karten der Startseite setzt du ein 3×3-Panorama mit Kyogre, Mega-Rayquaza und Groudon
      zusammen. Setlogo und Set-Infos passen zur Sprache des jeweiligen PDFs.
