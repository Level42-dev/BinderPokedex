name: Verify Release Build

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-release-candidate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'hotfix/') ||
      contains(github.event.pull_request.labels.*.name, 'full-release-check')
    uses: ./.github/workflows/build-release.yml
    with:
      release_tag: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
      release_notes_tag: v10.0
      artifact_retention_days: 3
